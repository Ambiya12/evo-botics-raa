<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evo-Botics Robot Bridge</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7fafc;
      color: #172033;
    }
    main {
      width: min(680px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      background: white;
      box-shadow: 0 12px 30px rgba(23, 32, 51, 0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    p {
      margin: 8px 0;
      color: #52606d;
      line-height: 1.5;
    }
    code {
      padding: 2px 5px;
      border-radius: 4px;
      background: #eef2f7;
      color: #243b53;
    }
  </style>
</head>
<body>
  <main>
    <h1>Evo-Botics Robot Bridge</h1>
    <p>This service provides the camera HTTP stream and rosbridge companion for the Evo-Botics dashboard.</p>
    <p>Camera stream: <code>/camera/stream</code></p>
    <p>Camera snapshot: <code>/camera/snapshot</code></p>
    <p>Use the Laravel admin dashboard at <code>/admin/robot</code> for robot control.</p>
  </main>
</body>
</html>
